[package]
name = "claude-sidecar"
version = "3.0.0"
edition = "2021"
description = "Localhost HTTP sidecar that runs allowlisted build/test commands outside a sandbox for coding agents, with create-then-poll job streaming and live SSE."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["sandbox", "sidecar", "subprocess", "pty", "claude"]
categories = ["command-line-utilities", "web-programming::http-server", "development-tools"]
repository = "https://github.com/EtaCassiopeia/claude-sidecar"

[lib]
name = "claude_sidecar"
path = "src/lib.rs"

[[bin]]
name = "claude-sidecar"
path = "src/main.rs"

[[bin]]
name = "sidecar-tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[features]
tui = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:reqwest",
    "dep:reqwest-eventsource",
    "dep:futures",
    "dep:tokio-util",
    "dep:color-eyre",
    "dep:regex",
]

[dependencies]
# HTTP framework — routing, extractors, JSON, and native SSE.
axum = "0.7"

# Async runtime.
tokio = { version = "1", features = ["full"] }
# Adapts channels/receivers into the `Stream` the SSE handler yields.
async-stream = "0.3"

# PTY support via nix + raw libc for setsid/killpg on timeout.
nix = { version = "0.29", features = ["term", "process", "signal", "fs"] }
libc = "0.2"

# Serialization. `rc` lets us serialize `Arc<JobLine>` directly (the line buffer
# is shared between the history vec and live broadcast).
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Command policy config file.
toml = "0.8"

# Job IDs.
uuid = { version = "1", features = ["v4"] }

# HTML → Markdown for the browser bridge's `format: "markdown"` mode. Turndown-
# style converter with pure-Rust deps (Servo's html5ever), no C toolchain.
htmd = "0.5"

# Markdown → Google-Docs-pasteable HTML (`/gdocs/clipboard`). `default-features
# = false` drops pulldown-cmark's own HTML writer, which we can't use: Docs
# ignores <style> blocks, so we emit inline style attributes from the event
# stream instead. `regex-fancy` (not the default `regex-onig`) keeps this a
# pure-Rust build — onig needs a C toolchain.
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "html",
    "dump-load",
    "regex-fancy",
] }
# Bundles bat's grammar set — the reason we can highlight Scala at all, which
# syntect's own defaults don't cover.
two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
] }
# Diagrams and images travel to Docs as base64 data URIs.
base64 = "0.22"

# Durable call metrics: Parquet storage plus an in-process SQL engine, so
# `claude-sidecar query` needs no external tool. `arrow` and `parquet` are
# deliberately NOT declared separately — datafusion re-exports both
# (`datafusion::arrow`, `datafusion::parquet`), and naming them here resolved a
# second, incompatible major version of arrow into the tree alongside
# datafusion's own. Default features are off to drop the ones this never uses
# (avro, csv-as-a-first-class-source, crypto/encoding expression packs).
datafusion = { version = "55", default-features = false, features = [
    "parquet",
    "sql",
    "datetime_expressions",
    "unicode_expressions",
] }

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors.
thiserror = "1"
anyhow = "1"

# CLI.
clap = { version = "4", features = ["derive", "env"] }

# TUI (optional — enabled by the `tui` feature).
ratatui             = { version = "0.30", optional = true }
crossterm           = { version = "0.29", optional = true, features = ["event-stream"] }
reqwest             = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-eventsource = { version = "0.6", optional = true }
# Already in the tree via syntect, so enabling it here adds no new dependency.
regex               = { version = "1", optional = true }
futures             = { version = "0.3", optional = true }
tokio-util          = { version = "0.7", optional = true }
color-eyre          = { version = "0.6", optional = true }

[dev-dependencies]
# `ServiceExt::oneshot` for driving the router in HTTP-level tests.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
# Thin LTO and parallel codegen units, not `lto = true` + `codegen-units = 1`.
# Fat LTO holds the whole dependency graph's IR in one rustc process, which the
# DataFusion crates are large enough to push past available RAM — the release
# build died with SIGKILL (the OOM killer) in datafusion-datasource, not a
# compile error. Thin LTO optimizes across crates incrementally and gets most of
# the benefit; the binary is stripped anyway, and this is a local dev tool whose
# bottleneck is process spawning, not codegen.
lto = "thin"
codegen-units = 16
strip = true
